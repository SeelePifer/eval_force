[project]
name = "evalforge-api"
version = "0.1.0"
description = "EvalForge run history API"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "evalforge",
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
]

[tool.uv.sources]
evalforge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_api"]
