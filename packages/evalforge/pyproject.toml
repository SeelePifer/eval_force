[project]
name = "evalforge"
version = "0.1.0"
description = "Reproducible quality-versus-cost gate for LLM releases"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "jinja2>=3.1.5",
  "pydantic>=2.10.4",
  "pyyaml>=6.0.2",
]

[project.scripts]
evalforge = "evalforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/evalforge/templates/report.html.j2" = "evalforge/templates/report.html.j2"
